<div class="nav-img">
    <nav>
        <div class="logo">
            <h1>Expense Calculator</h1>
        </div>
        <ul>
            <li><a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Home</a></li>
            <li><a a routerLink="/Friends" routerLinkActive="active" ariaCurrentWhenActive="page">Friends</a></li>
            <li><a routerLink="/History" routerLinkActive="active" ariaCurrentWhenActive="page">History</a></li>
            <li><a routerLink="/Vacation" routerLinkActive="active" ariaCurrentWhenActive="page"><i
                        class="bi bi-box-arrow-right" style="margin-right: 5px;"></i>{{trip}}</a></li>
        </ul>
        <div class="menu">
            <i class="bi bi-list" (click)="responsiveToggle()"></i>
        </div>
    </nav>
    <div>
        <div class="sub-header">
            <h2>PAYMENT DETAILS</h2>
        </div>
        <table class="table table-striped table-fixed table-lock-height">
            <thead>
                <tr>
                    <th>PAYMENT DATE</th>
                    <th>CATEGORY</th>
                    <th>AMOUNT PAID</th>
                    <th>CASH/UPI</th>
                    <th>NOTES</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let m of memberPayments ">
                    <td>{{m.paymentDate | date: 'dd/MM/yyyy'}}</td>
                    <td>{{m.categoryName}}</td>
                    <td>{{m.amount}}</td>
                    <td>{{m.paymentType}}</td>
                    <td>{{m.notes}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
